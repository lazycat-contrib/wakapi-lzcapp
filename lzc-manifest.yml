application:
  subdomain: wakapi
  upstreams:
    - location: /
      backend: http://wakapi:3000/
  public_path:
    - /
services:
  wakapi:
    # upstream: ghcr.io/muety/wakapi:2.18.0
    image: ghcr.1ms.run/muety/wakapi:2.18.0
    user: "0:0"
    environment:
      - WAKAPI_PASSWORD_SALT={{ stable_secret "wakapi_password_salt" }}
      - WAKAPI_LISTEN_IPV4=0.0.0.0
      - WAKAPI_PUBLIC_URL=https://{{ .S.AppDomain }}
      - WAKAPI_INSECURE_COOKIES=false
      - WAKAPI_TRUSTED_HEADER_AUTH=true
      - WAKAPI_TRUSTED_HEADER_AUTH_KEY=X-HC-User-ID
      - WAKAPI_TRUSTED_HEADER_AUTH_ALLOW_SIGNUP=true
      - WAKAPI_TRUST_REVERSE_PROXY_IPS=172.28.0.0/16,172.29.0.0/16,172.30.0.0/16
    binds:
      - /lzcapp/var/data:/data
